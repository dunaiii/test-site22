<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Na-Trans — Вантажні перевезення Варшава</title>
<meta name="description" content="Вантажні перевезення та переїзди у Варшаві та в радіусі 20 км. Зв'язок тільки по телефону.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#17233D;
    --navy-2:#1F2E4D;
    --amber:#E3993C;
    --amber-dark:#C77E22;
    --kraft:#F1E9DA;
    --paper:#FBF9F5;
    --slate:#242B3B;
    --slate-soft:#616B80;
    --line: rgba(23,35,61,0.14);
    --radius: 4px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    color:var(--slate);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  h1,h2,h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0;
    font-weight:700;
  }
  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--amber-dark);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:22px;
    height:2px;
    background:var(--amber-dark);
    display:inline-block;
  }
  section.on-dark .eyebrow{color:var(--amber);}
  section.on-dark .eyebrow::before{background:var(--amber);}

  button{font-family:inherit; cursor:pointer;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(251,249,245,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    max-width:1180px;
    margin:0 auto;
    gap:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
  }
  .brand-logo{
    height:46px;
    width:auto;
    display:block;
    flex-shrink:0;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.16em;
    color:var(--slate-soft);
    text-transform:uppercase;
  }
  .nav-links{
    display:flex;
    gap:28px;
    list-style:none;
    margin:0;padding:0;
    font-size:14px;
    font-weight:600;
  }
  .nav-links a{
    text-decoration:none;
    color:var(--slate);
    position:relative;
    padding-bottom:4px;
  }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; bottom:0;
    width:0; height:2px; background:var(--amber);
    transition:width .2s ease;
  }
  .nav-links a:hover::after{width:100%;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .lang-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
  }
  .lang-toggle button{
    border:none;background:transparent;
    padding:6px 12px;
    color:var(--slate-soft);
    transition:all .15s ease;
  }
  .lang-toggle button.active{
    background:var(--navy); color:#fff;
  }
  .phone-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--navy); color:#fff;
    padding:9px 16px;
    border-radius:999px;
    text-decoration:none;
    font-size:13.5px;
    font-weight:700;
    white-space:nowrap;
    transition:background .2s ease;
  }
  .phone-pill:hover{background:var(--amber-dark);}
  .phone-pill svg{width:14px;height:14px;flex-shrink:0;}

  /* mobile burger + dropdown menu */
  .burger{
    display:none;
    width:38px;height:38px;
    border:1px solid var(--line);
    border-radius:6px;
    background:transparent;
    align-items:center;justify-content:center;
    flex-direction:column;
    gap:4px;
    flex-shrink:0;
  }
  .burger span{
    width:18px;height:2px;
    background:var(--navy);
    display:block;
    transition:transform .2s ease, opacity .2s ease;
  }
  .burger.is-open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
  .burger.is-open span:nth-child(2){opacity:0;}
  .burger.is-open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
  .mobile-menu{
    display:none;
    flex-direction:column;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    max-height:0;
    transition:max-height .25s ease;
  }
  .mobile-menu.is-open{max-height:320px;}
  .mobile-menu a{
    padding:15px 24px;
    text-decoration:none;
    color:var(--navy);
    font-weight:700;
    font-size:15px;
    border-top:1px solid var(--line);
    font-family:'Oswald', sans-serif;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }

  /* sticky mobile call bar */
  .mobile-call-bar{
    display:none;
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:60;
    background:var(--navy);
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,0.18);
  }
  .mobile-call-bar a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--amber);
    color:var(--navy);
    text-decoration:none;
    font-weight:800;
    font-size:15.5px;
    padding:13px;
    border-radius:8px;
    font-family:'Oswald', sans-serif;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .mobile-call-bar svg{width:18px;height:18px;}

  /* ---------- HERO ---------- */
  .hero{
    padding:76px 0 60px;
    position:relative;
    overflow:hidden;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:52px;
    align-items:center;
  }
  .hero h1{
    font-size:clamp(32px, 4.4vw, 50px);
    line-height:1.08;
    color:var(--navy);
    margin-bottom:20px;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--amber-dark);
  }
  .hero p.lead{
    font-size:17px;
    line-height:1.6;
    color:var(--slate-soft);
    max-width:46ch;
    margin-bottom:30px;
  }
  .cta-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:14px 24px;
    border-radius:6px;
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.01em;
    border:1.5px solid transparent;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn svg{width:17px;height:17px;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{
    background:var(--amber);
    color:var(--navy);
    box-shadow:0 6px 0 var(--amber-dark);
  }
  .btn-primary:hover{box-shadow:0 8px 0 var(--amber-dark);}
  .btn-outline{
    border-color:var(--navy);
    color:var(--navy);
    background:transparent;
  }
  .btn-outline:hover{background:var(--navy); color:#fff;}
  .contact-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--slate-soft);
  }

  .hero-art{
    position:relative;
  }
  .hero-photo-frame{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 24px 50px -20px rgba(23,35,61,0.35);
  }
  .hero-photo-frame img{width:100%; height:340px; object-fit:cover;}
  .tape{
    position:absolute;
    top:-14px; left:-46px;
    width:170px; height:38px;
    background:repeating-linear-gradient(45deg, rgba(227,153,60,0.94) 0 10px, rgba(199,126,34,0.94) 10px 20px);
    transform:rotate(-40deg);
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
  }
  .plate-chip{
    position:absolute;
    left:16px; bottom:16px;
    background:rgba(23,35,61,0.88);
    color:#fff;
    padding:7px 12px;
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.1em;
    display:flex; align-items:center; gap:8px;
  }
  .plate-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}

  /* perforated divider between sections */
  .perf{
    position:relative;
    height:0;
    border-top:2px dashed var(--line);
  }
  .perf::before,.perf::after{
    content:"";
    position:absolute; top:-9px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--paper);
  }
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}
  section.on-kraft + section .perf,
  .to-kraft::before,.to-kraft::after{background:var(--kraft);}

  /* ---------- SERVICES ---------- */
  .services{
    background:var(--kraft);
    padding:78px 0 74px;
    position:relative;
  }
  .services::before, .services::after{
    content:"";
    position:absolute; top:-9px;
    width:18px;height:18px;border-radius:50%;
    background:var(--paper);
  }
  .services::before{left:calc(50% - 590px + 0px); }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    margin-bottom:40px;
    flex-wrap:wrap;
  }
  .section-head h2{
    font-size:clamp(26px,3vw,36px);
    color:var(--navy);
  }
  .services-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  .service-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px 18px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .service-card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px -16px rgba(23,35,61,0.28);
  }
  .service-check{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .service-check svg{width:15px;height:15px; stroke:var(--amber);}
  .service-card h3{
    font-size:15px;
    text-transform:none;
    letter-spacing:0;
    line-height:1.3;
    color:var(--navy);
    font-weight:700;
    margin-bottom:6px;
  }
  .service-card p{
    font-size:13px;
    color:var(--slate-soft);
    line-height:1.5;
    margin:0;
  }
  .cargo-tags{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    margin-top:34px;
    padding-top:28px;
    border-top:1px dashed var(--line);
    align-items:center;
  }
  .cargo-tag{
    display:flex; align-items:center; gap:9px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.05em;
    color:var(--slate);
    font-weight:500;
  }
  .cargo-tag svg{width:18px;height:18px; stroke:var(--amber-dark);}

  /* ---------- COVERAGE / MAP ---------- */
  .coverage{
    background:var(--navy);
    color:#fff;
    padding:82px 0;
    position:relative;
  }
  .coverage::before, .coverage::after{
    content:"";
    position:absolute; top:-9px;
    width:18px;height:18px;border-radius:50%;
    background:var(--kraft);
  }
  .coverage .wrap{
    display:grid;
    grid-template-columns:0.85fr 1.15fr;
    gap:50px;
    align-items:center;
  }
  .coverage h2{color:#fff; font-size:clamp(26px,3vw,36px); margin-bottom:16px;}
  .coverage p{
    color:rgba(255,255,255,0.72);
    font-size:15.5px;
    line-height:1.65;
    max-width:42ch;
    margin-bottom:22px;
  }
  .coverage-stats{
    display:flex;
    gap:28px;
    margin-top:26px;
  }
  .coverage-stat b{
    display:block;
    font-family:'Oswald', sans-serif;
    font-size:30px;
    color:var(--amber);
    line-height:1;
  }
  .coverage-stat span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.6);
    text-transform:uppercase;
  }
  .coverage-visual{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 30px 60px -24px rgba(0,0,0,0.5);
    background:
      radial-gradient(circle at 30% 20%, rgba(227,153,60,0.08), transparent 55%),
      var(--navy-2);
    padding:44px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
  }
  .country-stamp{
    width:172px; height:172px;
    border-radius:50%;
    border:3px dashed var(--amber);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-7deg);
    flex-shrink:0;
  }
  .country-stamp-code{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:52px;
    color:var(--amber);
    line-height:1;
    letter-spacing:0.02em;
  }
  .country-stamp-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.85);
    margin-top:8px;
    text-transform:uppercase;
  }
  .city-tags{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  .city-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.82);
    border:1px dashed rgba(255,255,255,0.3);
    border-radius:999px;
    padding:6px 14px;
  }

  /* ---------- WHY US ---------- */
  .why{
    background:var(--paper);
    padding:80px 0 70px;
  }
  .why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:56px;
  }
  .why-card{
    padding:26px 22px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--kraft);
  }
  .why-card .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--amber-dark);
    letter-spacing:0.08em;
    margin-bottom:14px;
    display:block;
  }
  .why-card h3{
    font-size:16.5px;
    text-transform:none;
    letter-spacing:0;
    color:var(--navy);
    margin-bottom:8px;
  }
  .why-card p{
    font-size:13.5px;
    color:var(--slate-soft);
    line-height:1.55;
    margin:0;
  }
  .brands{
    display:flex;
    align-items:center;
    gap:36px;
    flex-wrap:wrap;
    padding-top:32px;
    border-top:1px dashed var(--line);
  }
  .brands-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--slate-soft);
  }
  .brand-word-mark{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.04em;
    color:var(--slate);
    opacity:0.62;
  }

  /* ---------- CONTACT ---------- */
  .contact{
    background:var(--amber);
    padding:74px 0;
    position:relative;
    overflow:hidden;
  }
  .contact .wrap{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
    flex-wrap:wrap;
  }
  .contact h2{
    color:var(--navy);
    font-size:clamp(26px,3.4vw,40px);
    margin-bottom:10px;
  }
  .contact .eyebrow{color:var(--navy); }
  .contact .eyebrow::before{background:var(--navy);}
  .contact-phone{
    font-family:'Oswald', sans-serif;
    font-size:clamp(26px,3.2vw,36px);
    color:var(--navy);
    text-decoration:none;
    display:inline-block;
    margin:6px 0 10px;
  }
  .contact-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .contact-buttons .btn-primary{
    background:var(--navy);
    color:#fff;
    box-shadow:0 6px 0 #0c1526;
  }
  .contact-buttons .btn-outline{
    border-color:var(--navy);
  }
  .contact-note{color:rgba(23,35,61,0.72); margin-top:14px;}
  .contact-right{
    text-align:right;
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--navy);
    color:rgba(255,255,255,0.6);
    padding:34px 0;
  }
  footer .wrap{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
  }
  footer .foot-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.05em;
  }

  @media (max-width: 920px){
    .hero .wrap{grid-template-columns:1fr;}
    .hero-art{order:-1;}
    .services-grid{grid-template-columns:repeat(2,1fr);}
    .coverage .wrap{grid-template-columns:1fr;}
    .why-grid{grid-template-columns:1fr;}
    .nav-links{display:none;}
    .burger{display:flex;}
    .mobile-menu{display:flex;}
    .contact .wrap{flex-direction:column; align-items:flex-start;}
    .contact-right{text-align:left;}
  }
  @media (max-width: 760px){
    .mobile-call-bar{display:block;}
    body{padding-bottom:74px;}
    .hero{padding-top:32px;}
  }
  @media (max-width: 560px){
    .services-grid{grid-template-columns:1fr;}
    .cta-row{flex-direction:column; align-items:stretch;}
    .nav{padding:12px 18px;}
    .wrap{padding:0 18px;}
    .phone-pill span.full{display:none;}
    .hero-photo-frame img{height:220px;}
    .tape{left:-30px; width:130px;}
    .brands{gap:20px;}
    .coverage-stats{gap:20px;}
    .country-stamp{width:132px; height:132px;}
    .country-stamp-code{font-size:38px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body data-lang="uk">

<header>
  <nav class="nav">
    <a href="#top" class="brand">
      <img class="brand-logo" src="logo-navy.png" alt="Na-Trans">
      <div>
        <div class="brand-sub t" data-uk="Вантажні перевезення" data-pl="Transport i przeprowadzki"></div>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="#services" class="t" data-uk="Послуги" data-pl="Usługi"></a></li>
      <li><a href="#coverage" class="t" data-uk="Зона роботи" data-pl="Obszar działania"></a></li>
      <li><a href="#why" class="t" data-uk="Переваги" data-pl="Zalety"></a></li>
      <li><a href="#contact" class="t" data-uk="Контакти" data-pl="Kontakt"></a></li>
    </ul>
    <div class="nav-right">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-set-lang="uk" class="active">UA</button>
        <button type="button" data-set-lang="pl">PL</button>
      </div>
      <a class="phone-pill" href="tel:+48784727385">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="full">+48 784 727 385</span>
      </a>
      <button type="button" class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

<script>
  // ---------- Language switching ----------
  var texts = document.querySelectorAll('.t');
  function applyLang(lang){
    texts.forEach(function(el){
      var val = el.getAttribute('data-' + lang);
      if(val !== null){ el.textContent = val; }
    });
    document.body.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang === 'uk' ? 'uk' : 'pl');
    document.querySelectorAll('[data-set-lang]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-set-lang') === lang);
    });
    try{ localStorage.setItem('mj-lang', lang); }catch(e){}
  }
  document.querySelectorAll('[data-set-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-set-lang'));
    });
  });
  var savedLang = 'uk';
  try{ savedLang = localStorage.getItem('mj-lang') || 'uk'; }catch(e){}
  applyLang(savedLang);

  // ---------- Mobile menu ----------
  var burgerBtn = document.getElementById('burgerBtn');
  var mobileMenu = document.getElementById('mobileMenu');
  if(burgerBtn && mobileMenu){
    burgerBtn.addEventListener('click', function(){
      var open = mobileMenu.classList.toggle('is-open');
      burgerBtn.classList.toggle('is-open', open);
      burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    mobileMenu.querySelectorAll('a').forEach(function(link){
      link.addEventListener('click', function(){
        mobileMenu.classList.remove('is-open');
        burgerBtn.classList.remove('is-open');
        burgerBtn.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // ---------- Copy phone number ----------
  var phoneNumber = '+48 784 727 385';
  document.querySelectorAll('.js-copy-phone').forEach(function(btn){
    btn.addEventListener('click', function(){
      var label = btn.querySelector('.js-copy-label');
      var lang = document.body.getAttribute('data-lang') || 'uk';
      var done = lang === 'uk' ? 'Номер скопійовано' : 'Numer skopiowany';
      function showDone(){
        if(label){
          var prev = label.textContent;
          label.textContent = done;
          setTimeout(function(){ label.textContent = prev; }, 1800);
        }
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(phoneNumber).then(showDone).catch(showDone);
      } else {
        var tmp = document.createElement('textarea');
        tmp.value = phoneNumber;
        document.body.appendChild(tmp);
        tmp.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(tmp);
        showDone();
      }
    });
  });
</script>
